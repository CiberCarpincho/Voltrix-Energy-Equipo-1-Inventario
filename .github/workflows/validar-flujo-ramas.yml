name: Flujo de ramas
on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited]

permissions: {}

# Ramas individuales autorizadas para integrarse en develop.
# Al incorporar un nuevo integrante, agrega su rama a esta lista.
env:
  RAMAS_INDIVIDUALES: "saragon jeas sarias scalvo srubio"

jobs:
  validar-origen:
    name: Validar origen del PR
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar origen y destino
        shell: bash
        env:
          MISMO_REPOSITORIO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ORIGEN: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: |
          if [[ "$MISMO_REPOSITORIO" != "true" ]]; then
            echo "::error::El PR debe proceder del repositorio del equipo."
            exit 1
          fi

          if [[ "$DESTINO" == "main" ]]; then
            if [[ "$ORIGEN" == "develop" ]]; then
              exit 0
            fi
            echo "::error::Solo la rama develop puede integrarse en main."
            exit 1
          fi

          if [[ "$DESTINO" == "develop" ]]; then
            for rama in $RAMAS_INDIVIDUALES; do
              if [[ "$ORIGEN" == "$rama" ]]; then
                exit 0
              fi
            done
            echo "::error::La rama '$ORIGEN' no está autorizada para integrarse en develop. Ramas permitidas: $RAMAS_INDIVIDUALES."
            exit 1
          fi

          echo "::error::El destino del PR no está autorizado."
          exit 1
