name: voltrix-inventario
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=10"]
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U inventario -d inventario"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [inventario]

  api:
    build:
      context: ../..
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: inventario
      PGUSER: inventario
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      PGSSLMODE: disable
      PGCONNECT_TIMEOUT: "1"
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [inventario]

volumes:
  pgdata:

networks:
  inventario:
    driver: bridge
