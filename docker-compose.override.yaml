# Solo para desarrollo local: "docker compose up" (desde la raíz) combina este archivo con
# docker-compose.yaml. Construye la imagen desde el código y publica PostgreSQL en
# localhost, en el puerto POSTGRES_PUERTO_HOST.
# El pipeline de CD no copia este archivo a la EC2: en producción PostgreSQL no publica puertos.
services:
  api:
    image: voltrix-inventario-api:local
    build:
      context: .

  db:
    ports:
      - "127.0.0.1:${POSTGRES_PUERTO_HOST:-5433}:5432"
