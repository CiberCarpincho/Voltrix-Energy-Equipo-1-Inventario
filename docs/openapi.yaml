                    {
                      "id": "PL-002-TB-01",
                      "plantaId": "PL-002",
                      "tipo": "turbina",
                      "estado": "en_mantenimiento",
                      "capacidadNominalKw": 50,
                      "fechaInstalacion": "2024-08-02",
                      "actualizadoEn": "2026-11-19T14:00:00Z"
                    }
