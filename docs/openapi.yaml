{
  "openapi": "3.0.3",
  "info": {
    "title": "Voltrix Energy · Inventario de Activos",
    "version": "1.0.0",
    "description": "Contrato HTTP del servicio **Inventario de Activos** (Equipo 1), servicio raíz de la\nplataforma Voltrix Energy. Mantiene el catálogo de plantas y de activos físicos\n(paneles solares, turbinas y bancos de baterías) con su estado operativo vigente.\n\n**Consumidores previstos**\n\n| Equipo | Servicio | Operaciones que usa |\n|---|---|---|\n| 2 | Telemetría de Plantas | `POST /activos/consulta`, `POST /activos/actualizaciones-estado`, `GET /activos/{id}` |\n| 4 | Reportes de Generación | `GET /plantas`, `GET /activos?plantaId=` |\n| 5 | Pronóstico de Generación | `GET /plantas`, `GET /plantas/{plantaId}`, `GET /activos?plantaId=` |\n| 6 | Mantenimiento Predictivo | `GET /activos?estado=`, `GET /activos/{id}` |\n\n**Convenciones**\n\n- Identificadores de planta: `PL-001` … `PL-080`. Identificadores de activo:\n  `<plantaId>-<tipo>-<nn>`, con tipo `PS` (panel solar), `TB` (turbina) o `BB` (banco de baterías).\n  Ejemplo: `PL-001-PS-07`.\n- Las fechas usan RFC 3339 **con zona horaria** (`2026-11-19T14:00:00Z` o `2026-11-19T09:00:00-05:00`).\n- Cada consumidor envía `X-Equipo-Consumidor` (por ejemplo `equipo-2`) para que los logs del\n  proveedor identifiquen la llamada. Toda respuesta incluye `X-Request-Id`.\n- Ante sobrecarga el servicio responde `429` con `Retry-After`. Si la base de datos no está\n  disponible responde `503`.\n- La URL base de EC2 se publica en la hoja compartida de coordinación (no se fija en el código\n  de los consumidores).\n",
    "contact": {
      "name": "Equipo 1 · Inventario de Activos"
    }
  },
  "servers": [
    {
      "url": "http://{host}:{puerto}",
      "description": "Despliegue del Componente B (EC2) o entorno local. La dirección vigente está en la hoja compartida.",
      "variables": {
        "host": {
          "default": "localhost",
          "description": "IP pública o DNS de la instancia EC2."
        },
        "puerto": {
          "default": "8080"
        }
      }
    }
  ],
  "tags": [
    {
      "name": "Plantas",
      "description": "Catálogo de microplantas."
    },
    {
      "name": "Activos",
      "description": "Catálogo de activos y consulta de su estado vigente."
    },
    {
      "name": "Lotes",
      "description": "Operaciones masivas procesadas en paralelo (requisito de paralelismo del Equipo 1)."
    },
    {
      "name": "Operación",
      "description": "Salud del servicio y publicación del contrato."
    }
  ],
  "paths": {
    "/plantas": {
