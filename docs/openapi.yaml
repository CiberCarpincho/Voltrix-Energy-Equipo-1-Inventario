                    "id": "PL-001",
                    "nombre": "Microplanta Solar Jamundí",
                    "tipo": "solar",
                    "clienteId": "CLI-COOP-01",
                    "municipio": "Jamundí",
                    "capacidadInstaladaKw": 120.5
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Planta creada.",
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/X-Request-Id"
              },
              "Location": {
                "description": "Ruta del recurso creado.",
                "schema": {
                  "type": "string",
                  "example": "/plantas/PL-001"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Planta"
                },
                "examples": {
                  "creada": {
                    "$ref": "#/components/examples/PlantaSolar"
