AWSTemplateFormatVersion: '2010-09-09'
Description: Voltrix Equipo 1 - API de Inventario y PostgreSQL en EC2
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnet:
    Type: AWS::EC2::Subnet::Id
    Description: Subred de la VPC con ruta a un Internet Gateway
  ApiClientCidr:
    Type: String
    Description: CIDR IPv4 de clientes autorizados a consultar la API
  InstanceType:
    Type: String
    AllowedValues: [t3.micro, t2.micro]
    Description: Tipo x86 de 1 GiB validado para la cuenta y region
  SourceCommit:
    Type: String
    AllowedPattern: '[a-f0-9]{40}'
    Description: SHA publicado en el repositorio con el codigo de HU-04
  UbuntuImage:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
Resources:
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso HTTP a Inventario
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref ApiClientCidr
  InventoryHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref UbuntuImage
      MetadataOptions:
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnet
          GroupSet: [!Ref ApiSecurityGroup]
      Tags:
        - Key: Name
          Value: Voltrix-Equipo-1-Inventario
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/voltrix-inventario.log /dev/console) 2>&1
          if ! swapon --show=NAME --noheadings | grep -q .; then
            fallocate -l 1G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y docker.io docker-compose-v2 git openssl curl
          systemctl enable --now docker
          git clone https://github.com/CiberCarpincho/Voltrix-Energy-Equipo-1-Inventario.git /opt/voltrix
          cd /opt/voltrix
          git checkout --detach '${SourceCommit}'
          cd deploy/compose
          umask 077
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://localhost:8080/health
          echo
          docker compose ps
          docker stats --no-stream
          free -m
          swapon --show
          bash /opt/voltrix/infra/ec2/cd/instalar.sh /opt/voltrix
Outputs:
  ApiUrl:
    Value: !Sub 'http://${InventoryHost.PublicIp}:8080'
  InstanceId:
    Value: !Ref InventoryHost
